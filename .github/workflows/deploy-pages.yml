name: Deploy PokeTree to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'legacy/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - '.nojekyll'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run engine tests
        run: node --test tests/engine.test.cjs
      - name: Assemble Pages artifact
        run: bash scripts/prepare-pages.sh
      - name: Validate deployed file tree and links
        run: node --test tests/pages.test.cjs

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Assemble Pages artifact
        run: bash scripts/prepare-pages.sh
      - name: Validate Pages artifact before upload
        run: node --test tests/pages.test.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public URLs and deployed revision
        env:
          PAGES_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/check-live-pages.sh
