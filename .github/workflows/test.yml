name: PokeTree engine tests
on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'game/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
