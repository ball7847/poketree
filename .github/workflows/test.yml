name: PokeTree engine tests
on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'tests/**'
      - 'scripts/**'
      - 'legacy/**'
      - 'index.html'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'game/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/prepare-pages.sh
      - name: Engine regression tests
        if: always()
        run: node --test tests/engine.test.cjs
      - name: Technique regression tests
        if: always()
        run: node --test tests/techniques.test.cjs
      - name: Tool regression tests
        if: always()
        run: node --test tests/tools.test.cjs
      - name: Warehouse regression tests
        if: always()
        run: node --test tests/warehouse.test.cjs
      - name: Region data and gates
        if: always()
        run: node --test --test-name-pattern="six region specifications" tests/regions.test.cjs
      - name: Region step and unlock
        if: always()
        run: node --test --test-name-pattern="noncombat steps" tests/regions.test.cjs
      - name: Region routes and boss
        if: always()
        run: node --test --test-name-pattern="each route" tests/regions.test.cjs
      - name: Region combat victory
        if: always()
        run: node --test --test-name-pattern="combat turn" tests/regions.test.cjs
      - name: Region party wipe
        if: always()
        run: node --test --test-name-pattern="full defeat" tests/regions.test.cjs
      - name: Region save compatibility
        if: always()
        run: node --test --test-name-pattern="restoring old save" tests/regions.test.cjs
      - name: Deployment artifact tests
        if: always()
        run: node --test tests/pages.test.cjs
      - name: Install browser testing runtime
        run: npm install --no-save --no-package-lock playwright-core@1.58.2
      - name: Chromium user-flow smoke tests
        run: node tests/browser-smoke.cjs
